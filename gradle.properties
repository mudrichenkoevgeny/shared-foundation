# Gradle Build Configuration

# Enable parallel project execution and build caching for performance
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# JVM memory settings required for Kotlin Multiplatform compilation (JVM, Android, iOS, WasmJS).
# Prevents java.lang.OutOfMemoryError: Metaspace during native/multi-target compilation.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError

# Kotlin compiler daemon memory configuration
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Suppress AGP commonTest warnings for KMP modules
android.sync.suppressAgpWarnings=GENERIC
