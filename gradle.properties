# Project Identity & Versioning (Single Source of Truth)
group=io.github.mudrichenkoevgeny
version=0.1.16

# POM Metadata for Maven Central Publishing
POM_URL=https://github.com/mudrichenkoevgeny/shared-foundation
POM_SCM_URL=https://github.com/mudrichenkoevgeny/shared-foundation
POM_SCM_CONNECTION=scm:git:git://github.com/mudrichenkoevgeny/shared-foundation.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://github.com/mudrichenkoevgeny/shared-foundation.git
POM_LICENCE_NAME=The Apache License, Version 2.0
POM_LICENCE_URL=http://www.apache.org/licenses/LICENSE-2.0.txt
