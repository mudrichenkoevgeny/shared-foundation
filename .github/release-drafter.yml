name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
template: |
  $CHANGES

  ## New Contributors
  $CONTRIBUTORS
categories:
  - title: 'Breaking Changes'
    labels:
      - 'breaking-change'
      - 'breaking'
  - title: 'Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: 'Bug Fixes'
    labels:
      - 'fix'
      - 'bug'
  - title: 'Maintenance & Infrastructure'
    labels:
      - 'chore'
      - 'ci'
      - 'documentation'
      - 'dependencies'
change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'
version-resolver:
  default: patch
