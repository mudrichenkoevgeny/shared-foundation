name: Release & Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-maven-central:
    name: Publish Maven Central (GPG Signed)
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment & Toolchains
        uses: ./.github/actions/setup-env

      - name: Build Multiplatform Artifacts
        run: ./gradlew assemble

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        run:
          ./gradlew -p tools/gradle-plugin publishAndReleaseToMavenCentral --no-configuration-cache
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

  publish-npm:
    name: Publish NPM Package (@mudrichenkoevgeny/shared-foundation)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment & Toolchains
        uses: ./.github/actions/setup-env

      - name: Update npm to latest (for OIDC Trusted Publishing)
        run: npm install -g npm@latest

      - name: Generate NPM Package
        run: ./gradlew generateNpmPackage

      - name: Publish to npmjs.com
        run: npm publish ./build/npm-package --access public --provenance

  publish-docs:
    name: Publish Dokka API Reference to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment & Toolchains
        uses: ./.github/actions/setup-env

      - name: Generate Dokka HTML Documentation
        run: ./gradlew dokkaGenerate

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/dokka/html
