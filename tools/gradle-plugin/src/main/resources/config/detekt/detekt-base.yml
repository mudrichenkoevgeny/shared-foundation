config:
  validation: true
  warningsAsErrors: false

complexity:
  active: true
  ComplexCondition:
    active: true
    allowedConditions: 6
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 20
    ignoreSingleWhenExpression: true
  LargeClass:
    active: true
    allowedLines: 800
  LongMethod:
    active: true
    allowedLines: 150
  LongParameterList:
    active: true
    allowedFunctionParameters: 8
    allowedConstructorParameters: 12
  NestedBlockDepth:
    active: true
    allowedDepth: 5
  TooManyFunctions:
    active: true
    allowedFunctionsPerFile: 50
    allowedFunctionsPerClass: 50
    allowedFunctionsPerInterface: 50
    allowedFunctionsPerObject: 50
    allowedFunctionsPerEnum: 50

naming:
  active: true
  ClassNaming:
    active: true
    classPattern: '[A-Z][a-zA-Z0-9]*'
  ConstructorParameterNaming:
    active: true
    parameterPattern: '[a-z][a-zA-Z0-9]*'
  EnumNaming:
    active: true
    enumEntryPattern: '[A-Z][A-Za-z0-9_]*'
  FunctionNaming:
    active: true
    functionPattern: '([a-zA-Z][a-zA-Z0-9]*)|(`[^`]+`)'
    ignoreAnnotated:
      - 'Test'
      - 'ParameterizedTest'
      - 'org.junit.jupiter.api.Test'
  MatchingDeclarationName:
    active: true
  ObjectPropertyNaming:
    active: true
    constantPattern: '[A-Z][A-Za-z0-9_]*'
    propertyPattern: '([a-z][a-zA-Z0-9]*)|([A-Z][A-Za-z0-9_]*)'
  PackageNaming:
    active: true
    packagePattern: '[a-z]+(\.[a-z][a-z0-9]*)*'
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][A-Za-z0-9_]*'
    propertyPattern: '([a-z][a-zA-Z0-9]*)|([A-Z][A-Za-z0-9_]*)'
  VariableNaming:
    active: true
    variablePattern: '[a-z][a-zA-Z0-9]*'

style:
  active: true
  ClassOrdering:
    active: true
  BracesOnIfStatements:
    active: true
  LoopWithTooManyJumpStatements:
    active: false
  MagicNumber:
    active: false
  MandatoryBracesLoops:
    active: true
  MaxLineLength:
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  UnusedImport:
    active: true
  UnusedPrivateClass:
    active: true
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true
  WildcardImport:
    active: true

exceptions:
  active: true
  SwallowedException:
    active: true
    excludes:
      - '**/*Test*.kt'
      - '**/*Test*/**'
      - '**/testing/**'
      - '**/testFixtures/**'
  TooGenericExceptionCaught:
    active: true
    excludes:
      - '**/*Test*.kt'
      - '**/*Test*/**'
      - '**/testing/**'
      - '**/testFixtures/**'
  TooGenericExceptionThrown:
    active: true
    excludes:
      - '**/*Test*.kt'
      - '**/*Test*/**'
      - '**/testing/**'
      - '**/testFixtures/**'
  PrintStackTrace:
    active: true
    excludes:
      - '**/*Test*.kt'
      - '**/*Test*/**'
      - '**/testing/**'
      - '**/testFixtures/**'

potential-bugs:
  active: true
  UnsafeCallOnNullableType:
    active: true

shared-rules:
  active: true
  NoFullyQualifiedName:
    active: true
  NoInlineComment:
    active: true
  PreferValueOverName:
    active: true
  ProhibitNonSafeAssertion:
    active: true
  ProhibitPrintln:
    active: true

comments:
  active: true
  UndocumentedPublicClass:
    active: true
    excludes:
      - '**/*Test*.kt'
      - '**/*Test*/**'
      - '**/testing/**'
      - '**/testFixtures/**'
    searchInNestedClass: true
    searchInInnerClass: true
    searchInInnerObject: false
    searchInInnerInterface: true
    ignoreDefaultCompanionObject: true
  UndocumentedPublicFunction:
    active: true
    excludes:
      - '**/*Test*.kt'
      - '**/*Test*/**'
      - '**/testing/**'
      - '**/testFixtures/**'
  UndocumentedPublicProperty:
    active: false
